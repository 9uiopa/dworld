# 배포용
services:
  web: # 서비스 이름 : web
    image: 9uiopa/dworld:v1.3
    ports:
      - "80:8080" # 호스트의 80 포트를 컨테이너 8080포트와 연결
    environment:
      - SPRING_REDIS_HOST=redis # Redis 호스트 이름
      - SPRING_REDIS_PORT=6379 # Redis 포트 번호
      - TZ=Asia/Seoul # docker 컨테이너 timezone 설정
    depends_on:
      - elasticsearch
      - redis
    restart: always
    networks:
      - app-network

  elasticsearch:
    image: 9uiopa/elasticsearch_nori
    ports:
      - '9200:9200'
    environment:
      - discovery.type=single-node
    volumes: # 도커 볼륨
      - elasticsearchdb:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - app-network

  redis:
    image: redis:latest
    ports:
      - "6379:6379" # Redis 기본 포트
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  elasticsearchdb:
